[package]
name = "miy-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
async-trait = "0.1"
miy-app-collab = { path = "sdk/collab" }
anyhow = "1"
axum = { version = "=0.8.9", features = ["macros","ws"] }
chrono = { version = "0.4", features = ["serde"] }
miy-app-sdk = { path = "sdk/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "=0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "macros"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

utoipa = "=6.0.0"
utoipa-axum = "=0.3.0"

[dev-dependencies]
hex = "0.4"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"

[workspace]
