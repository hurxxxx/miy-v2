[package]
name = "miy-app-sdk"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "=0.8.9"
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "=0.8.6", features = ["runtime-tokio-rustls", "postgres"] }
tokio = { version = "1", features = ["full"] }
