name: Isolated runtime regression

# Runs the PostgreSQL/Docker/CLI regression (permissions, delegation, runtime,
# operations, auth and CLI suites) that unit tests skip as ignored entry points.
# scripts/runtime-regression/run.py owns setup, the suite counts and cleanup.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Permissions, delegation and runtime against PostgreSQL and Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select the containerd store on this disposable runner
        # Match the reference server store. Docker 28's classic store exports an
        # OCI index but still reports a config digest as image .Id; that is a
        # different native-export contract from the one this suite exercises.
        run: |
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('/etc/docker/daemon.json')
          settings = json.loads(path.read_text()) if path.exists() else {}
          settings.setdefault('features', {})['containerd-snapshotter'] = True
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(settings, indent=2) + '\n')
          PY
          sudo systemctl restart docker
          docker version --format 'Docker server: {{.Server.Version}}'
          docker info --format '{{json .DriverStatus}}' | python3 -c '
          import json, sys
          status = json.load(sys.stdin)
          print("Docker driver status: " + json.dumps(status))
          if ["driver-type", "io.containerd.snapshotter.v1"] not in status:
              raise SystemExit("Runtime regression requires the containerd image store")
          '
      - name: Free runner disk for the Docker storage floor
        # The core refuses builds and image loads below 15 GiB and 15% free on the
        # Docker data root. Keep that default; remove preinstalled SDKs instead.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$(docker info --format '{{.DockerRootDir}}')"
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Fetch locked crates for the offline regression build
        run: cargo fetch --locked
      - name: Pull the fixed regression images
        run: |
          docker pull postgres:18.3
          docker pull python:3.14-slim
      - name: Run the isolated regression
        run: python3 scripts/runtime-regression/run.py
