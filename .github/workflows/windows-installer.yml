name: Windows installer candidate

on:
  workflow_dispatch:
    inputs:
      installer_commit:
        description: Full 40-character installer source commit (embedded CLI retains its original commit)
        required: true
        type: string
      cli_run_id:
        description: Successful CLI release candidate run containing the verified Windows artifact
        required: true
        type: string
      cli_version:
        description: Exact CLI version, such as 0.6.3
        required: true
        type: string
      cli_commit:
        description: Full source commit of the selected CLI candidate
        required: true
        type: string
      cli_archive_sha256:
        description: SHA-256 of the selected Windows CLI archive
        required: true
        type: string
      cli_binary_sha256:
        description: SHA-256 of miy.exe inside that archive
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-installer-${{ inputs.installer_commit }}
  cancel-in-progress: false

# This workflow wraps the already verified Windows CLI. It does not rebuild,
# relabel, or publish the five-target CLI/helper aggregate or a GitHub release.
env:
  INSTALLER_COMMIT: ${{ inputs.installer_commit }}
  CLI_VERSION: ${{ inputs.cli_version }}
  CLI_COMMIT: ${{ inputs.cli_commit }}
  CLI_ARCHIVE_SHA256: ${{ inputs.cli_archive_sha256 }}
  CLI_BINARY_SHA256: ${{ inputs.cli_binary_sha256 }}
  CLI_RUN_ID: ${{ inputs.cli_run_id }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.installer_commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind installer build to a clean full source commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:INSTALLER_COMMIT -cnotmatch '^[a-f0-9]{40}$') { throw 'Use a full lowercase installer source commit.' }
          if ($env:CLI_COMMIT -cnotmatch '^[a-f0-9]{40}$' -or $env:CLI_VERSION -cnotmatch '^\d+\.\d+\.\d+$' -or $env:CLI_RUN_ID -cnotmatch '^[1-9][0-9]*$') { throw 'Invalid CLI candidate identity.' }
          if ($env:CLI_ARCHIVE_SHA256 -cnotmatch '^[a-f0-9]{64}$' -or $env:CLI_BINARY_SHA256 -cnotmatch '^[a-f0-9]{64}$') { throw 'Invalid CLI candidate checksums.' }
          if ((git rev-parse HEAD) -cne $env:INSTALLER_COMMIT) { throw 'Installer checkout identity differs.' }
          if (git status --porcelain --untracked-files=normal) { throw 'Installer checkout is not clean.' }
          python scripts/test-windows-installer-package.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # CI reuses the verified original candidate artifact; installation itself
      # is offline and contains no company server URL or artifact dependency.
      - name: Download the selected verified Windows CLI artifact
        uses: actions/download-artifact@v4
        with:
          name: cli-release-x86_64-pc-windows-msvc
          run-id: ${{ inputs.cli_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .local/windows-installer/original-cli
      - name: Verify and select the original Windows CLI payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $null = New-Item -ItemType Directory -Force .local/windows-installer/input
          $archive = '.local/windows-installer/original-cli/miy-' + $env:CLI_VERSION + '-x86_64-pc-windows-msvc.zip'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:CLI_ARCHIVE_SHA256) {
            throw 'Original CLI archive checksum differs.'
          }
          Copy-Item -LiteralPath $archive -Destination .local/windows-installer/input/cli.zip
      - name: Build the Windows x64 GUI installer
        shell: powershell
        run: |
          & ./ops/windows-installer/build.ps1 -ArchivePath .local/windows-installer/input/cli.zip -Sha256 $env:CLI_ARCHIVE_SHA256 -OutputDirectory .local/windows-installer/build -InstallerCommit $env:INSTALLER_COMMIT -Version $env:CLI_VERSION -CliCommit $env:CLI_COMMIT -CliBinarySha256 $env:CLI_BINARY_SHA256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check packaged installation, preservation, HTTP and GUI rendering
        shell: powershell
        run: |
          & ./ops/windows-installer/test.ps1 -InstallerPath ('.local/windows-installer/build/MiySetup-' + $env:CLI_VERSION + '-windows-x64.exe') -ArchivePath .local/windows-installer/input/cli.zip -OutputDirectory .local/windows-installer/evidence -Version $env:CLI_VERSION -CliCommit $env:CLI_COMMIT -CliBinarySha256 $env:CLI_BINARY_SHA256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package installer with separate installer and CLI provenance
        shell: pwsh
        run: |
          python scripts/package-windows-installer.py package --installer ".local/windows-installer/build/MiySetup-$env:CLI_VERSION-windows-x64.exe" --cli-archive .local/windows-installer/input/cli.zip --output .local/windows-installer/package --installer-commit $env:INSTALLER_COMMIT --cli-commit $env:CLI_COMMIT --archive-sha256 $env:CLI_ARCHIVE_SHA256 --cli-binary-sha256 $env:CLI_BINARY_SHA256 --version $env:CLI_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve safe native test diagnostics, including failed runs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-diagnostics-${{ inputs.installer_commit }}
          path: |
            .local/windows-installer/evidence/summary.json
            .local/windows-installer/evidence/embedded-provenance.json
            .local/windows-installer/evidence/initial-form.png
            .local/windows-installer/evidence/completed-form.png
            .local/windows-installer/evidence/ui-state.json
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-build-${{ inputs.installer_commit }}
          path: |
            .local/windows-installer/package/MiySetup-${{ inputs.cli_version }}-windows-x64.exe
            .local/windows-installer/package/MiySetup-${{ inputs.cli_version }}-windows-x64.exe.sha256
            .local/windows-installer/package/installer-index.json
            .local/windows-installer/evidence/summary.json
            .local/windows-installer/evidence/embedded-provenance.json
            .local/windows-installer/evidence/initial-form.png
            .local/windows-installer/evidence/completed-form.png
            .local/windows-installer/evidence/ui-state.json
          include-hidden-files: true
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.installer_commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer-build-${{ inputs.installer_commit }}
          path: .local/windows-installer/downloaded
      - name: Verify embedded CLI and immutable Linux publication without publishing
        run: |
          python scripts/test-windows-installer-package.py
          python scripts/package-windows-installer.py verify --directory .local/windows-installer/downloaded/package --installer-commit "$INSTALLER_COMMIT" --cli-commit "$CLI_COMMIT"
          python scripts/stage-windows-installer.py --source .local/windows-installer/downloaded/package --destination .local/windows-installer/staging-check --installer-commit "$INSTALLER_COMMIT" --cli-commit "$CLI_COMMIT"
          python scripts/stage-windows-installer.py --source .local/windows-installer/downloaded/package --destination .local/windows-installer/staging-check --installer-commit "$INSTALLER_COMMIT" --cli-commit "$CLI_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: miy-windows-installer-${{ inputs.installer_commit }}
          path: .local/windows-installer/downloaded/*
          include-hidden-files: true
          if-no-files-found: error

# Windows Server 2022 automation verifies this candidate; it is not a claim of
# Windows 11 user validation, Authenticode signing, or a completed CLI release gate.
