name: Windows installer candidate

on:
  workflow_dispatch:
    inputs:
      installer_commit:
        description: Full 40-character installer source commit (embedded CLI retains its original commit)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-installer-${{ inputs.installer_commit }}
  cancel-in-progress: false

# This workflow wraps the already verified Windows CLI. It does not rebuild,
# relabel, or publish the five-target CLI/helper aggregate or a GitHub release.
env:
  INSTALLER_COMMIT: ${{ inputs.installer_commit }}
  CLI_VERSION: '0.6.0'
  CLI_COMMIT: b67798bfb84f299257ba4326beaf034b125cde7a
  CLI_ARCHIVE_SHA256: d7cc2e1b4cca63b215b525a51f85372792db5241c218185635fe693a714ea87f
  CLI_BINARY_SHA256: 99f590c62b44e4b61391b8986d5fa6175ebee1d072efd066bbc85747e38eac71

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.installer_commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind installer build to a clean full source commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:INSTALLER_COMMIT -cnotmatch '^[a-f0-9]{40}$') { throw 'Use a full lowercase installer source commit.' }
          if ((git rev-parse HEAD) -cne $env:INSTALLER_COMMIT) { throw 'Installer checkout identity differs.' }
          if (git status --porcelain --untracked-files=normal) { throw 'Installer checkout is not clean.' }
          python scripts/test-windows-installer-package.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # CI reuses the verified original candidate artifact; installation itself
      # is offline and contains no company server URL or artifact dependency.
      - name: Download the original verified Windows CLI artifact
        uses: actions/download-artifact@v4
        with:
          name: cli-release-x86_64-pc-windows-msvc
          run-id: 40602334949
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .local/windows-installer/original-cli
      - name: Verify and select the original Windows CLI payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $null = New-Item -ItemType Directory -Force .local/windows-installer/input
          $archive = '.local/windows-installer/original-cli/miy-0.6.0-x86_64-pc-windows-msvc.zip'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:CLI_ARCHIVE_SHA256) {
            throw 'Original CLI archive checksum differs.'
          }
          Copy-Item -LiteralPath $archive -Destination .local/windows-installer/input/cli.zip
      - name: Build the Windows x64 GUI installer
        shell: powershell
        run: |
          & ./ops/windows-installer/build.ps1 -ArchivePath .local/windows-installer/input/cli.zip -Sha256 $env:CLI_ARCHIVE_SHA256 -OutputDirectory .local/windows-installer/build -InstallerCommit $env:INSTALLER_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check packaged installation, preservation, HTTP and GUI rendering
        shell: powershell
        run: |
          & ./ops/windows-installer/test.ps1 -InstallerPath .local/windows-installer/build/MiySetup-0.6.0-windows-x64.exe -ArchivePath .local/windows-installer/input/cli.zip -OutputDirectory .local/windows-installer/evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package installer with separate installer and CLI provenance
        shell: pwsh
        run: |
          python scripts/package-windows-installer.py package --installer .local/windows-installer/build/MiySetup-0.6.0-windows-x64.exe --cli-archive .local/windows-installer/input/cli.zip --output .local/windows-installer/package --installer-commit $env:INSTALLER_COMMIT --cli-commit $env:CLI_COMMIT --archive-sha256 $env:CLI_ARCHIVE_SHA256 --cli-binary-sha256 $env:CLI_BINARY_SHA256 --version $env:CLI_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve safe native test diagnostics, including failed runs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-diagnostics-${{ inputs.installer_commit }}
          path: |
            .local/windows-installer/evidence/summary.json
            .local/windows-installer/evidence/embedded-provenance.json
            .local/windows-installer/evidence/initial-form.png
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-build-${{ inputs.installer_commit }}
          path: |
            .local/windows-installer/package/MiySetup-0.6.0-windows-x64.exe
            .local/windows-installer/package/MiySetup-0.6.0-windows-x64.exe.sha256
            .local/windows-installer/package/installer-index.json
            .local/windows-installer/evidence/summary.json
            .local/windows-installer/evidence/embedded-provenance.json
            .local/windows-installer/evidence/initial-form.png
          include-hidden-files: true
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.installer_commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer-build-${{ inputs.installer_commit }}
          path: .local/windows-installer/downloaded
      - name: Verify embedded CLI and immutable Linux publication without publishing
        run: |
          python scripts/test-windows-installer-package.py
          python scripts/package-windows-installer.py verify --directory .local/windows-installer/downloaded/package --installer-commit "$INSTALLER_COMMIT" --cli-commit "$CLI_COMMIT"
          python scripts/stage-windows-installer.py --source .local/windows-installer/downloaded/package --destination .local/windows-installer/staging-check --installer-commit "$INSTALLER_COMMIT" --cli-commit "$CLI_COMMIT"
          python scripts/stage-windows-installer.py --source .local/windows-installer/downloaded/package --destination .local/windows-installer/staging-check --installer-commit "$INSTALLER_COMMIT" --cli-commit "$CLI_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: miy-windows-installer-${{ inputs.installer_commit }}
          path: .local/windows-installer/downloaded/*
          include-hidden-files: true
          if-no-files-found: error

# Windows Server 2022 automation verifies this candidate; it is not a claim of
# Windows 11 user validation, Authenticode signing, or a completed CLI release gate.
