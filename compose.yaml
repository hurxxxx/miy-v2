name: miy-v2-validation
services:
  postgres:
    image: postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
    # Core, identity, every installation's role limits and development sessions share this
    # cluster; 100 leaves no room for one more installation (docs/CAPACITY.md).
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_PASSWORD: ${MIY_PG_ADMIN_PASSWORD:?run scripts/bootstrap.py}
    ports: ["127.0.0.1:${MIY_POSTGRES_PORT:-15432}:5432"]
    networks: [default, app_runtime]
    volumes:
      - pgdata:/var/lib/postgresql
      - ${MIY_STATE_DIR:-./.local}/init.sql:/docker-entrypoint-initdb.d/10-miy.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 40
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    command: ["start", "--import-realm", "--features=resource-indicators"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/miy_identity
      KC_DB_USERNAME: miy_identity
      KC_DB_PASSWORD: ${MIY_IDENTITY_PASSWORD:?}
      # Shares PostgreSQL with the core and apps; the default pool of 100 would exceed
      # the whole connection budget (docs/CAPACITY.md, scripts/check-db-connections.py).
      KC_DB_POOL_MAX_SIZE: "10"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /identity
      KC_HOSTNAME: ${MIY_CONSOLE_ORIGIN:?run scripts/bootstrap.py}/identity
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${MIY_IDENTITY_ADMIN_PASSWORD:?}
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:${MIY_IDENTITY_PORT:-18181}:8080"]
    volumes: ["${MIY_STATE_DIR:-./.local}/realm.json:/opt/keycloak/data/import/miy-realm.json:ro"]
    depends_on:
      postgres: {condition: service_healthy}
  proxy:
    image: caddy:2.11.2@sha256:25cdc846626b62d05f6b633b9b40c2c9f6ef89b515dc76133cefd920f7dbe562
    # Linux host networking reaches loopback-only Core and Keycloak. Caddy binds
    # only the configured interface/ports; it never opens extra ports 80 or 443.
    network_mode: host
    environment:
      MIY_ORIGIN: ${MIY_ORIGIN:?run scripts/bootstrap.py}
      MIY_CONSOLE_ORIGIN: ${MIY_CONSOLE_ORIGIN:?run scripts/bootstrap.py}
      MIY_DEV_PORTAL_ORIGIN: ${MIY_DEV_PORTAL_ORIGIN:?run scripts/bootstrap.py}
      MIY_CORE_UPSTREAM: ${MIY_CORE_UPSTREAM:-127.0.0.1:18080}
      MIY_CONSOLE_CORE_UPSTREAM: ${MIY_CONSOLE_CORE_UPSTREAM:-127.0.0.1:18081}
      MIY_DEV_PORTAL_CORE_UPSTREAM: ${MIY_DEV_PORTAL_CORE_UPSTREAM:-127.0.0.1:18082}
      MIY_IDENTITY_UPSTREAM: ${MIY_IDENTITY_UPSTREAM:-127.0.0.1:18181}
      MIY_PORTAL_HOST: ${MIY_PORTAL_HOST:?run scripts/bootstrap.py}
      MIY_CONSOLE_HOST: ${MIY_CONSOLE_HOST:?run scripts/bootstrap.py}
      MIY_DEV_PORTAL_HOST: ${MIY_DEV_PORTAL_HOST:?run scripts/bootstrap.py}
      MIY_PORTAL_PORT: ${MIY_PORTAL_PORT:?run scripts/bootstrap.py}
      MIY_CONSOLE_PORT: ${MIY_CONSOLE_PORT:?run scripts/bootstrap.py}
      MIY_DEV_PORTAL_PORT: ${MIY_DEV_PORTAL_PORT:?run scripts/bootstrap.py}
      MIY_PUBLIC_SCHEME: ${MIY_PUBLIC_SCHEME:?run scripts/bootstrap.py}
      MIY_PROXY_BIND: ${MIY_PROXY_BIND:-127.0.0.1}
      MIY_HTTP_PORT: ${MIY_HTTP_PORT:-18000}
    volumes:
      - ${MIY_CADDY_CONFIG:-./ops/Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./ops/Caddyfile.routes:/etc/caddy/routes.caddy:ro
      - ${MIY_STATE_DIR:-./.local}/caddy:/data
      - ./web/platform/dist:/srv/platform:ro
    depends_on: [keycloak]
volumes:
  pgdata:
networks:
  app_runtime:
    name: miy-v2-app-runtime
