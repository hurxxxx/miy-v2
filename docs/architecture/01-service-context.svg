<title id="title">서비스 전체 개념도</title><desc id="desc">기업의 업무 앱, 데이터와 AI 활용을 하나의 운영 환경에서 연결합니다</desc>
<defs><marker id="a-2363A1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363A1" /></marker><marker id="a-087F79" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087F79" /></marker><marker id="a-7250A3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7250A3" /></marker><marker id="a-9B671C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9B671C" /></marker><marker id="a-536B7C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#536B7C" /></marker></defs>
