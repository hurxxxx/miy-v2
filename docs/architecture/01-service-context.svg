<text x="1544" y="47" font-size="21" fill="#536B7C" font-weight="500" text-anchor="end">01 / 04</text>
<text x="56" y="108" font-size="46" fill="#153049" font-weight="700" text-anchor="start">서비스 전체 개념도</text>
<text x="56" y="151" font-size="24" fill="#536B7C" font-weight="400" text-anchor="start">고객사는 업무에 집중하고, 필요한 앱 개발과 유지관리를 전문 인력에 맡길 수 있습니다</text>
<text x="56" y="225" font-size="23" fill="#536B7C" font-weight="700" text-anchor="start">사용·개발·운영 주체</text><text x="1260" y="225" font-size="23" fill="#536B7C" font-weight="700" text-anchor="start">연결 시스템·자산</text><rect x="490" y="197" width="610" height="615" rx="4" fill="#FBFDFE" stroke="#2363A1" stroke-width="1.8" /><text x="522" y="255" font-size="44" fill="#153049" font-weight="800" text-anchor="start">miy</text><text x="1068" y="252" font-size="22" fill="#2363A1" font-weight="500" text-anchor="end">기업별 독립 설치</text><text x="522" y="296" font-size="27" fill="#153049" font-weight="600" text-anchor="start">기업용 AI 앱 개발·배포·운영 플랫폼</text><rect x="518" y="326" width="554" height="96" rx="0" fill="#ECF8F5" stroke="#087F79" stroke-width="1.8" /><text x="538" y="364" font-size="27" fill="#087F79" font-weight="700" text-anchor="start">업무 앱과 앱 포털</text><text x="538" y="399" font-size="22" fill="#536B7C" font-weight="400" text-anchor="start">필요한 앱을 찾아 사용하고 업무를 처리</text><rect x="518" y="438" width="554" height="96" rx="0" fill="#F4EFFA" stroke="#7250A3" stroke-width="1.8" /><text x="538" y="476" font-size="27" fill="#7250A3" font-weight="700" text-anchor="start">사이트 내장 AI 챗봇</text><text x="538" y="511" font-size="22" fill="#536B7C" font-weight="400" text-anchor="start">사내 자료 조회와 앱의 업무 기능 실행</text><rect x="518" y="550" width="554" height="96" rx="0" fill="#EFF5FC" stroke="#2363A1" stroke-width="1.8" /><text x="538" y="588" font-size="27" fill="#2363A1" font-weight="700" text-anchor="start">앱 개발·배포 관리</text><text x="538" y="623" font-size="22" fill="#536B7C" font-weight="400" text-anchor="start">내장·외부 Git, 앱 평가와 릴리스</text><rect x="518" y="662" width="554" height="96" rx="0" fill="#EFF5FC" stroke="#2363A1" stroke-width="1.8" /><text x="538" y="700" font-size="27" fill="#2363A1" font-weight="700" text-anchor="start">공통 자원과 운영 관리</text><text x="538" y="735" font-size="22" fill="#536B7C" font-weight="400" text-anchor="start">코어 업데이트, DB·파일, 로그와 백업</text><rect x="56" y="260" width="274" height="110" rx="0" fill="#FFFFFF" stroke="#087F79" stroke-width="1.8" /><text x="76" y="298" font-size="28" fill="#087F79" font-weight="700" text-anchor="start">고객사 직원</text><text x="76" y="333" font-size="22" fill="#536B7C" font-weight="400" text-anchor="start">앱과 챗봇으로 업무 수행</text><rect x="56" y="408" width="274" height="170" rx="0" fill="#FFFFFF" stroke="#2363A1" stroke-width="1.8" /><text x="76" y="445" font-size="25" fill="#2363A1" font-weight="700" text-anchor="start">앱 개발·유지보수</text><text x="76" y="480" font-size="21" fill="#536B7C" font-weight="400" text-anchor="start">개발사·파트너사</text><rect x="56" y="626" width="274" height="160" rx="0" fill="#FFFFFF" stroke="#2363A1" stroke-width="1.8" /><text x="76" y="663" font-size="24" fill="#2363A1" font-weight="700" text-anchor="start">코어·서버 유지관리</text><text x="76" y="698" font-size="19" fill="#536B7C" font-weight="400" text-anchor="start">개발사·유지관리 파트너</text><polyline points="330,315 490,315" fill="none" stroke="#087F79" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#a-087F79)" marker-start="url(#a-087F79)" /><text x="410" y="296" font-size="20" fill="#087F79" font-weight="500" text-anchor="middle">앱·챗봇 사용</text><polyline points="330,493 490,493" fill="none" stroke="#2363A1" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#a-2363A1)" marker-start="url(#a-2363A1)" /><text x="410" y="474" font-size="20" fill="#2363A1" font-weight="500" text-anchor="middle">앱 개발·배포</text><polyline points="330,706 490,706" fill="none" stroke="#2363A1" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#a-2363A1)" marker-start="url(#a-2363A1)" /><text x="410" y="687" font-size="20" fill="#2363A1" font-weight="500" text-anchor="middle">유지관리·운영</text><rect x="1260" y="295" width="284" height="145" rx="0" fill="#FFFFFF" stroke="#087F79" stroke-width="1.8" /><text x="1280" y="333" font-size="25" fill="#087F79" font-weight="700" text-anchor="start">기업 데이터·시스템</text><text x="1280" y="368" font-size="22" fill="#536B7C" font-weight="400" text-anchor="start">문서·파일·기존 DB</text><text x="1280" y="399" font-size="22" fill="#536B7C" font-weight="400" text-anchor="start">사내 서비스·업무 API</text><rect x="1260" y="478" width="284" height="112" rx="0" fill="#FFFFFF" stroke="#2363A1" stroke-width="1.8" /><text x="1280" y="516" font-size="26" fill="#2363A1" font-weight="700" text-anchor="start">외부 소스 저장소</text><text x="1280" y="551" font-size="22" fill="#536B7C" font-weight="400" text-anchor="start">GitHub·GitLab 등</text><rect x="1260" y="643" width="284" height="112" rx="0" fill="#FFFFFF" stroke="#7250A3" stroke-width="1.8" /><text x="1280" y="681" font-size="26" fill="#7250A3" font-weight="700" text-anchor="start">선택한 AI 모델</text><text x="1280" y="716" font-size="22" fill="#536B7C" font-weight="400" text-anchor="start">사내 모델 또는 외부 모델</text><polyline points="1100,368 1260,368" fill="none" stroke="#087F79" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#a-087F79)" marker-start="url(#a-087F79)" /><text x="1180" y="349" font-size="19" fill="#087F79" font-weight="500" text-anchor="middle">데이터·업무 연계</text><polyline points="1100,534 1260,534" fill="none" stroke="#2363A1" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#a-2363A1)" marker-start="url(#a-2363A1)" /><text x="1180" y="515" font-size="20" fill="#2363A1" font-weight="500" text-anchor="middle">소스 연계</text><polyline points="1100,699 1260,699" fill="none" stroke="#7250A3" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#a-7250A3)" marker-start="url(#a-7250A3)" /><text x="1180" y="680" font-size="19" fill="#7250A3" font-weight="500" text-anchor="middle">정책에 따라 연결</text>
<line x1="56" y1="834" x2="1544" y2="834" stroke="#CCD9E2" />
<text x="56" y="866" font-size="18" fill="#536B7C" font-weight="400" text-anchor="start">설치 위치와 운영 주체는 별도 선택 · 직접 운영 / 대행 / 공동 운영</text>
<text x="1544" y="866" font-size="18" fill="#536B7C" font-weight="400" text-anchor="end">기획안 · PRD 0.3 · 2026.10.20</text>
<text x="795" y="791" font-size="19" fill="#536B7C" font-weight="400" text-anchor="middle">설치 위치: 사내 서버·VM / 클라우드 서버·VM</text><text x="76" y="515" font-size="19" fill="#536B7C" font-weight="400" text-anchor="start">개발 가능한 도메인 전문가</text><text x="76" y="549" font-size="19" fill="#536B7C" font-weight="400" text-anchor="start">고객사 자체 개발도 지원</text><text x="76" y="731" font-size="19" fill="#536B7C" font-weight="400" text-anchor="start">또는 고객사 운영 담당자</text><text x="76" y="764" font-size="19" fill="#536B7C" font-weight="400" text-anchor="start">업데이트·백업·장애 대응</text></svg>