<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">논리 아키텍처 구성도</title><desc id="desc">플랫폼 관리, 격리된 앱 실행과 내부 Hermes의 대화 실행을 구분하고 공통 정책으로 연결합니다.</desc><defs><marker id="a-2363A1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363A1" /></marker><marker id="a-087F79" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087F79" /></marker><marker id="a-7250A3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7250A3" /></marker><marker id="a-536B7C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#536B7C" /></marker></defs><style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-kerning:normal}</style><rect width="1600" height="900" fill="white" /><text x="56" y="47" font-size="28" fill="#087F79" font-weight="800" text-anchor="start">miy</text><text x="1544" y="47" font-size="21" fill="#536B7C" font-weight="500" text-anchor="end">02 / 04</text><text x="56" y="108" font-size="46" fill="#153049" font-weight="700" text-anchor="start">논리 아키텍처 구성도</text><text x="56" y="151" font-size="24" fill="#536B7C" font-weight="400" text-anchor="start">공통 플랫폼이 앱 실행을 관리하고, 내장 Hermes가 챗봇의 모델·도구 호출을 반복합니다</text><rect x="394" y="185" width="1150" height="635" fill="#FBFDFE" stroke="#CCD9E2" stroke-width="1.8" /><text x="416" y="220" font-size="27" fill="#153049" font-weight="700" text-anchor="start">기업별 miy 플랫폼</text><text x="1518" y="220" font-size="20" fill="#536B7C" font-weight="400" text-anchor="end">사내 서버·VM 또는 클라우드 서버·VM</text><rect x="56" y="260" width="278" height="114" fill="#EFF5FC" stroke="#2363A1" stroke-width="1.8" /><text x="76" y="298" font-size="28" fill="#2363A1" font-weight="700" text-anchor="start">miy 웹 UI</text><text x="76" y="333" font-size="22" fill="#536B7C" font-weight="400" text-anchor="start">앱 포털·관리·내장 챗봇</text><rect x="56" y="423" width="278" height="145" fill="#EFF5FC" stroke="#2363A1" stroke-width="1.8" /><text x="76" y="461" font-size="28" fill="#2363A1" font-weight="700" text-anchor="start">앱 개발 도구</text><text x="76" y="496" font-size="22" fill="#536B7C" font-weight="400" text-anchor="start">CLI와 개발 에이전트</text><text x="76" y="527" font-size="22" fill="#536B7C" font-weight="400" text-anchor="start">앱 계약·개발 맥락 활용</text><polyline points="334,317 422,317" fill="none" stroke="#2363A1" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#a-2363A1)" marker-start="url(#a-2363A1)" /><polyline points="334,495 422,495" fill="none" stroke="#2363A1" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#a-2363A1)" marker-start="url(#a-2363A1)" /><text x="56" y="635" font-size="19" fill="#536B7C" font-weight="400" text-anchor="start">고객사·개발사·파트너·전문가가</text><text x="56" y="665" font-size="19" fill="#536B7C" font-weight="400" text-anchor="start">역할별로 개발·유지관리에 참여</text><polyline points="56,720 84,720" fill="none" stroke="#2363A1" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#a-2363A1)" /><text x="98" y="727" font-size="19" fill="#2363A1" font-weight="400" text-anchor="start">관리·개발·배포</text><polyline points="56,750 84,750" fill="none" stroke="#087F79" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#a-087F79)" /><text x="98" y="757" font-size="19" fill="#087F79" font-weight="400" text-anchor="start">업무·데이터</text><polyline points="56,780 84,780" fill="none" stroke="#7250A3" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#a-7250A3)" /><text x="98" y="787" font-size="19" fill="#7250A3" font-weight="400" text-anchor="start">내장 챗봇 실행</text><rect x="422" y="260" width="230" height="415" fill="#EFF5FC" stroke="#2363A1" stroke-width="1.8" /><text x="537" y="303" font-size="26" fill="#2363A1" font-weight="700" text-anchor="middle">플랫폼 API·MCP</text><text x="537" y="354" font-size="23" fill="#153049" font-weight="400" text-anchor="middle">인증·권한·정책</text><text x="537" y="388" font-size="23" fill="#153049" font-weight="400" text-anchor="middle">공통 서비스 계약</text><line x1="446" y1="414" x2="628" y2="414" stroke="#CCD9E2" /><text x="537" y="456" font-size="22" fill="#536B7C" font-weight="400" text-anchor="middle">앱 요청 라우팅</text><text x="537" y="490" font-size="22" fill="#536B7C" font-weight="400" text-anchor="middle">관리·개발 요청</text><line x1="446" y1="522" x2="628" y2="522" stroke="#CCD9E2" /><text x="537" y="563" font-size="22" fill="#7250A3" font-weight="400" text-anchor="middle">대화·실행 관리</text><text x="537" y="597" font-size="22" fill="#7250A3" font-weight="400" text-anchor="middle">디스패치·이벤트</text><rect x="708" y="260" width="362" height="156" fill="#FFFFFF" stroke="#2363A1" stroke-width="1.8" /><text x="728" y="298" font-size="29" fill="#2363A1" font-weight="700" text-anchor="start">관리 코어 (Rust)</text><text x="728" y="333" font-size="22" fill="#536B7C" font-weight="400" text-anchor="start">앱·소스·릴리스·환경</text><text x="728" y="364" font-size="22" fill="#536B7C" font-weight="400" text-anchor="start">격리 빌드·배포·상태 관리</text><polyline points="652,336 708,336" fill="none" stroke="#2363A1" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#a-2363A1)" /><polyline points="1070,336 1120,336" fill="none" stroke="#2363A1" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#a-2363A1)" /><text x="1095" y="319" font-size="18" fill="#2363A1" font-weight="500" text-anchor="middle">배포</text><rect x="1120" y="260" width="398" height="230" fill="#ECF8F5" stroke="#087F79" stroke-width="1.8" /><text x="1142" y="297" font-size="29" fill="#087F79" font-weight="700" text-anchor="start">격리된 앱 실행</text><text x="1142" y="326" font-size="20" fill="#536B7C" font-weight="400" text-anchor="start">개발·운영 분리 · 앱별 자원 한도</text><rect x