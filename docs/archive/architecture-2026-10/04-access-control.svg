<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">앱과 Hermes의 권한·데이터 접근</title><desc id="desc">사이트의 내장 챗봇은 내부 Hermes로 실행하며, 앱 호출과 같은 권한 계약을 적용합니다</desc>
<defs><marker id="arrow-2463A4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2463A4" /></marker><marker id="arrow-087D78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#087D78" /></marker><marker id="arrow-7152A3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7152A3" /></marker><marker id="arrow-9E691A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9E691A" /></marker><marker id="arrow-54697C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#54697C" /></marker></defs>
<style>text {font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;} text {font-kerning:normal;}</style>
<rect width="1600" height="900" fill="#FFFFFF" />
<text x="48" y="47" font-size="26" font-weight="800" fill="#087D78" text-anchor="start">miy</text>
<text x="1548" y="47" font-size="22" font-weight="500" fill="#54697C" text-anchor="end">04 / 04</text>
<text x="48" y="106" font-size="46" font-weight="700" fill="#14293D" text-anchor="start">앱과 Hermes의 권한·데이터 접근</text>
<text x="48" y="146" font-size="24" font-weight="400" fill="#54697C" text-anchor="start">고객사·외부 수행자의 앱 요청과 내장 챗봇에 같은 권한 계약을 적용합니다</text>
<text x="48" y="215" font-size="24" font-weight="700" fill="#54697C" text-anchor="start">사용 경로·내부 실행</text><text x="446" y="215" font-size="24" font-weight="700" fill="#54697C" text-anchor="start">서버의 권한 검사</text><text x="1016" y="215" font-size="24" font-weight="700" fill="#54697C" text-anchor="start">앱 실행과 데이터</text><rect x="48" y="250" width="316" height="105" fill="#F1F6FC" stroke="#2463A4" stroke-width="2" /><text x="72" y="291" font-size="26" font-weight="700" fill="#2463A4" text-anchor="start">고객사·외부 사용자</text><text x="72" y="331" font-size="21" font-weight="400" fill="#54697C" text-anchor="start">앱별 제한 사용자 토큰</text><rect x="48" y="402" width="316" height="163" fill="#F5F1FA" stroke="#7152A3" stroke-width="2" /><text x="72" y="443" font-size="28" font-weight="700" fill="#7152A3" text-anchor="start">내장 챗봇 실행</text><text x="72" y="483" font-size="23" font-weight="400" fill="#54697C" text-anchor="start">사이트 챗봇 → miy API</text><text x="72" y="517" font-size="23" font-weight="400" fill="#54697C" text-anchor="start">Hermes 모델·도구 루프</text><text x="72" y="551" font-size="23" font-weight="400" fill="#54697C" text-anchor="start">변경 전 사용자 확인</text><text x="206" y="594" font-size="21" font-weight="500" fill="#7152A3" text-anchor="middle">miy 설치 내부의 실행 엔진</text><rect x="446" y="250" width="470" height="315" fill="#FFFFFF" stroke="#2463A4" stroke-width="2" /><text x="470" y="292" font-size="28" font-weight="700" fill="#2463A4" text-anchor="start">사용자 요청의 유효 권한</text><text x="470" y="332" font-size="22" font-weight="400" fill="#54697C" text-anchor="start">아래 조건을 모두 만족해야 실행</text><text x="485" y="382" font-size="25" font-weight="400" fill="#14293D" text-anchor="start">현재 사용자 권한</text><text x="485" y="430" font-size="25" font-weight="400" fill="#14293D" text-anchor="start">토큰의 앱·환경·작업 범위</text><text x="485" y="478" font-size="25" font-weight="400" fill="#14293D" text-anchor="start">설치된 앱에 부여된 권한</text><text x="485" y="526" font-size="25" font-weight="400" fill="#14293D" text-anchor="start">대상 리소스의 접근 정책</text><polyline points="364,302 446,302" fill="none" stroke="#2463A4" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow-2463A4)" /><polyline points="364,483 446,483" fill="none" stroke="#7152A3" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow-7152A3)" /><rect x="48" y="634" width="316" height="117" fill="#EDF8F6" stroke="#087D78" stroke-width="2" /><text x="72" y="675" font-size="28" font-weight="700" fill="#087D78" text-anchor="start">예약·백그라운드 작업</text><text x="72" y="715" font-size="23" font-weight="400" fill="#54697C" text-anchor="start">별도 서비스 계정</text><rect x="446" y="634" width="470" height="133" fill="#FFFFFF" stroke="#087D78" stroke-width="2" /><text x="470" y="675" font-size="28" font-weight="700" fill="#087D78" text-anchor="start">서비스 계정의 유효 권한</text><text x="470" y="715" font-size="23" font-weight="400" fill="#54697C" text-anchor="start">계정·앱·환경·허용 작업</text><polyline points="364,692 446,692" fill="none" stroke="#087D78" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow-087D78)" /><rect x="1016" y="250" width="536" height="221" fill="#EDF8F6" stroke="#087D78" stroke-width="2" /><text x="1040" y="292" font-size="28" font-weight="700" fill="#087D78" text-anchor="start">격리된 앱 실행</text><rect x="1040" y="320" width="208" height="78" fill="#FFFFFF" stroke="#087D78" stroke-width="2" /><text x="1144" y="369" font-size="27" font-weight="600" fill="#14293D" text-anchor="middle">구매 앱</text><rect x="1320" y="320" width="208" height="78" fill="#FFFFFF" stroke="#087D78" stroke-width="2" /><text x="1424" y="369" font-size="27" font-weight="600" fill="#14293D" text-anchor="middle">자산 앱</text><polyline points="1248,359 1320,359" fill="none" stroke="#087D78" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow-087D78)" /><text x="1284" y="344" font-size="18" font-weight="600" fill="#087D78" text-anchor="middle">공개 API</text><text x="1040" y="442" font-size="23" font-weight="400" fill="#087D78" text-anchor="start">앱 간 호출에도 주체·앱 권한 확인</text><polyline points="916,360 1016,360" fill="none" stroke="#2463A4" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow-2463A4)" /><text x="965" y="338" font-size="20" font-weight="600" fill="#2463A4" text-anchor="middle">허용</text><polyline points="916,692 966,692 966,431 1016,431" fill="none" stroke="#087D78" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow-087D78)" /><polyline points="1284,471 1284,569" fill="none" stroke="#087D78" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow-087D78)" /><rect x="1036" y="491" width="496" height="42" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="1284" y="519" font-size="22" font-weight="500" fill="#087D78" text-anchor="middle">환경별 연결 · 서버 보관 자격증명</text><rect x="1016" y="569" width="536" height="151" fill="#FFFFFF" stroke="#087D78" stroke-width="2" /><text x="1040" y="610" font-size="28" font-weight="700" fill="#087D78" text-anchor="start">허용된 데이터</text><text x="1040" y="650" font-size="23" font-weight="400" fill="#54697C" text-anchor="start">앱 전용 DB · 파일 저장소</text><text x="1040" y="684" font-size="23" font-weight="400" fill="#54697C" text-anchor="start">외부 PostgreSQL · 사내 HTTP API</text><text x="1284" y="758" font-size="22" font-weight="500" fill="#54697C" text-anchor="middle">앱 간 직접 DB 공유는 허용하지 않음</text><text x="48" y="800" font-size="24" font-weight="500" fill="#14293D" text-anchor="start">권한 회수는 새 요청과 대기 중 작업에 반영하며, 실제 실행 직전에 현재 권한을 다시 확인합니다.</text>
<line x1="48" y1="830" x2="1552" y2="830" stroke="#C6D2DB" />
<text x="48" y="862" font-size="19" font-weight="400" fill="#54697C" text-anchor="start">앱·데이터 권한 · 코어·서버 유지관리 권한은 별도 위임</text>
<text x="1552" y="862" font-size="19" font-weight="400" fill="#54697C" text-anchor="end">PRD 0.3 · 2026.10.20</text>
<text x="470" y="747" font-size="22" fill="#54697C" font-weight="400" text-anchor="start">대상 리소스 정책을 함께 검사</text></svg>