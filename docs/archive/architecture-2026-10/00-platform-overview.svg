<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc">
<title id="title">miy 플랫폼 전체 구조: 개발·배포·운영과 서비스 제공 방식</title><desc id="desc">고객사, 개발사, 유지관리 파트너와 도메인 전문가가 기업별 miy에 참여한다. 사내 또는 클라우드 설치와 직접·대행·공동 운영을 선택한다. CLI·MCP 기반 개발, 개발 영역 평가와 커밋 릴리스 승격, 격리 앱·작업 큐, 내장 Hermes, 공통 권한과 데이터 연결, 코어 업데이트·복구를 한 장으로 표현한다.</desc>
