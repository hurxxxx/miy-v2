dth="185" height="114" rx="3" fill="#FFFFFF" stroke="#087F79" stroke-width="1.8" /><text x="1158.5" y="483" font-size="22" fill="#087F79" font-weight="700" text-anchor="middle">운영 활성화</text><text x="1158.5" y="512" font-size="18" fill="#536B7C" font-weight="400" text-anchor="middle">검증한 산출물 적용</text><rect x="1278" y="449" width="185" height="114" rx="3" fill="#FFFFFF" stroke="#087F79" stroke-width="1.8" /><text x="1370.5" y="483" font-size="22" fill="#087F79" font-weight="700" text-anchor="middle">운영 상태 검사</text><text x="1370.5" y="512" font-size="18" fill="#536B7C" font-weight="400" text-anchor="middle">상태·로그 확인</text><rect x="1066" y="651" width="185" height="84" rx="3" fill="#FFFFFF" stroke="#9B671C" stroke-width="1.8" /><text x="1158.5" y="685" font-size="22" fill="#9B671C" font-weight="700" text-anchor="middle">릴리스 선택·승격</text><text x="1158.5" y="714" font-size="18" fill="#536B7C" font-weight="400" text-anchor="middle">배포 권한 담당자</text><rect x="1278" y="651" width="185" height="84" rx="3" fill="#FFFFFF" stroke="#9B671C" stroke-width="1.8" /><text x="1370.5" y="685" font-size="22" fill="#9B671C" font-weight="700" text-anchor="middle">결과·운영 확인</text><text x="1370.5" y="714" font-size="18" fill="#536B7C" font-weight="400" text-anchor="middle">필요 시 복구</text><polyline points="403,311 430,311" fill="none" stroke="#2363A1" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#a-2363A1)" /><polyline points="615,311 642,311" fill="none" stroke="#2363A1" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#a-2363A1)" /><polyline points="827,311 854,311" fill="none" stroke="#2363A1" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#a-2363A1)" /><polyline points="677,353 677,449" fill="none" stroke="#2363A1" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#a-2363A1)" /><text x="667" y="409" font-size="18" fill="#2363A1" font-weight="500" text-anchor="end">제출</text><polyline points="790,449 790,353" fill="none" stroke="#087F79" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#a-087F79)" /><text x="800" y="409" font-size="18" fill="#087F79" font-weight="500" text-anchor="start">결과</text><polyline points="642,498 629,498 629,382 522,382 522,353" fill="none" stroke="#536B7C" stroke-width="2.8" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#a-536B7C)" /><text x="590" y="373" font-size="18" fill="#536B7C" font-weight="500" text-anchor="middle">수정·재평가</text><polyline points="946,353 946,449" fill="none" stroke="#2363A1" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#a-2363A1)" /><text x="962" y="409" font-size="18" fill="#2363A1" font-weight="500" text-anchor="start">커밋 기준</text><polyline points="946,563 946,602 1104,602 1104,651" fill="none" stroke="#087F79" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#a-087F79)" /><text x="1017" y="591" font-size="19" fill="#087F79" font-weight="600" text-anchor="middle">검증 통과</text><polyline points="1206,651 1206,563" fill="none" stroke="#9B671C" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#a-9B671C)" /><text x="1217" y="602" font-size="18" fill="#9B671C" font-weight="500" text-anchor="start">승격 요청</text><polyline points="1251,498 1278,498" fill="none" stroke="#087F79" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#a-087F79)" /><polyline points="1370,563 1370,651" fill="none" stroke="#087F79" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#a-087F79)" /><text x="1384" y="603" font-size="18" fill="#087F79" font-weight="500" text-anchor="start">상태 결과</text><text x="238" y="472" font-size="22" fill="#536B7C" font-weight="400" text-anchor="start">개발 중 평가는</text><text x="238" y="506" font-size="22" fill="#536B7C" font-weight="400" text-anchor="start">반복할 수 있습니다.</text><text x="238" y="687" font-size="21" fill="#536B7C" font-weight="400" text-anchor="start">고객사 또는 대행사의 배포 담당자가</text><text x="238" y="718" font-size="20" fill="#536B7C" font-weight="400" text-anchor="start">현재 권한으로 검증한 릴리스를 승격합니다.</text><text x="800" y="798" font-size="22" fill="#153049" font-weight="500" text-anchor="middle">미리보기는 커밋 전 작업본도 허용    /    운영에는 검증한 동일 산출물    /    개발·운영 데이터 분리</text>
<line x1="56" y1="834" x2="1544" y2="834" stroke="#CCD9E2" />
<text x="56" y="866" font-size="18" fill="#536B7C" font-weight="400" text-anchor="start">정상 흐름과 평가 반복 · 검증 실패 시 수정 후 재검증 · 개발 미리보기에는 운영 승격 불필요</text>
